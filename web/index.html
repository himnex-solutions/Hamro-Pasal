<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Hamro Pasal – Smart POS &amp; Business Management for Nepal">
  <meta name="keywords" content="hamro pasal, POS Nepal, inventory management Nepal, billing app Nepal">
  <meta name="author" content="Hamro Pasal">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hamro Pasal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hamro Pasal</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash screen styling -->
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #1B4FD8, #0D2F8A);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
    }
    #splash {
      text-align: center;
      color: white;
    }
    #splash .logo {
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.15);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 60px;
    }
    #splash h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    #splash p {
      font-size: 14px;
      opacity: 0.7;
      margin: 0;
    }
    .loader {
      width: 200px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin: 32px auto 0;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      background: white;
      border-radius: 4px;
      animation: load 1.5s ease-in-out infinite;
    }
    @keyframes load {
      0%   { width: 0%; }
      50%  { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">🏪</div>
    <h1>Hamro Pasal</h1>
    <p>Smart Business for Nepal</p>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: "{{flutter_service_worker_version}}",
        },
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          document.getElementById('splash').style.display = 'none';
          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
