<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Store building body -->
  <rect x="12" y="30" width="40" height="24" rx="2" fill="white" fill-opacity="0.95"/>

  <!-- Awning / roof bar -->
  <rect x="9" y="22" width="46" height="12" rx="3" fill="url(#awning)"/>

  <!-- Awning stripes -->
  <rect x="9" y="22" width="5" height="12" rx="1" fill="white" fill-opacity="0.25"/>
  <rect x="20" y="22" width="5" height="12" fill="white" fill-opacity="0.25"/>
  <rect x="31" y="22" width="5" height="12" fill="white" fill-opacity="0.25"/>
  <rect x="42" y="22" width="5" height="12" fill="white" fill-opacity="0.25"/>

  <!-- Roof line above awning -->
  <rect x="14" y="18" width="36" height="5" rx="2" fill="white" fill-opacity="0.6"/>

  <!-- Left window -->
  <rect x="14" y="33" width="12" height="9" rx="2" fill="#A5D6A7"/>
  <line x1="20" y1="33" x2="20" y2="42" stroke="white" stroke-width="1"/>
  <line x1="14" y1="38" x2="26" y2="38" stroke="white" stroke-width="1"/>

  <!-- Right window -->
  <rect x="38" y="33" width="12" height="9" rx="2" fill="#A5D6A7"/>
  <line x1="44" y1="33" x2="44" y2="42" stroke="white" stroke-width="1"/>
  <line x1="38" y1="38" x2="50" y2="38" stroke="white" stroke-width="1"/>

  <!-- Door -->
  <rect x="27" y="37" width="10" height="17" rx="2" fill="#2E7D32"/>
  <!-- Door handle -->
  <circle cx="35" cy="45" r="1" fill="#A5D6A7"/>

  <!-- Store sign -->
  <rect x="16" y="24" width="32" height="7" rx="1" fill="white" fill-opacity="0.9"/>
  <text x="32" y="30" text-anchor="middle" fill="#2E7D32" font-size="5.5" font-weight="800" font-family="Arial, sans-serif" letter-spacing="0.5">HAMRO PASAL</text>
</svg>
