name: hamro_pasal
description: "Hamro Pasal - Professional POS & Business Management App for Nepali Shops"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: any

  # Navigation
  go_router: ^14.2.7

  # UI / Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Date / Time
  intl: any
  nepali_utils: any

  # Storage / Local
  shared_preferences: ^2.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.4

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0

  # CSV Export
  csv: ^6.0.0

  # Barcode
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Image Picker
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.5
  freezed_annotation: any
  json_annotation: ^4.9.0
  logger: ^2.4.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2

  # Google Sign In
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: any
  freezed: any
  json_serializable: any
  hive_generator: any
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_size: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#1B4FD8"
